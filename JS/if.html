<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson 3: Conditionals (if / else)</title>
  <link rel="stylesheet" href="if.css">
</head>
<body>
  <h1>Lesson 3: Conditionals (if / else)</h1>
  
  <div class="container">
    <div class="box">
      <h2>1. Age Checker</h2>
      <input type="number" id="ageInput" placeholder="Enter your age" />
      <button onclick="checkAge()">Check Age</button>
      <p id="ageResult"></p>
    </div>

    <div class="box">
      <h2>2. Grade Calculator</h2>
      <input type="number" id="scoreInput" placeholder="Enter your score (0-100)" />
      <button onclick="calculateGrade()">Get Grade</button>
      <p id="gradeResult"></p>
    </div>
  </div>

  <script src="if.js"></script>
</body>
</html>
