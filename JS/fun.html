<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson 4: Functions</title>
  <link rel="stylesheet" href="fun.css">
</head>
<body>
  <h1>Lesson 4: Functions in JavaScript</h1>
  
  <div class="container">
    <div class="box">
      <h2>1. Greeting Function</h2>
      <input type="text" id="nameInput" placeholder="Enter your name" />
      <button onclick="sayHello()">Greet Me</button>
      <p id="greetingResult"></p>
    </div>

    <div class="box">
      <h2>2. Simple Calculator</h2>
      <input type="number" id="num1" placeholder="First number" />
      <input type="number" id="num2" placeholder="Second number" /><br><br>
      <button onclick="calculateSum()">Add Numbers</button>
      <p id="calcResult"></p>
    </div>
  </div>

  <script src="fun.js"></script>
</body>
</html>
