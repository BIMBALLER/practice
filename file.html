<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Developer | Day 12 Evolution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>
<body class="bg-slate-900 font-sans antialiased text-slate-200">

    <nav class="fixed top-0 w-full z-50 bg-red-900/80 backdrop-blur-md border-b border-gray-500/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg"></div>
                    <span class="text-xl font-bold tracking-tight text-red-500">DEV<span class="text-blue-500">FLOW</span></span>
                </div>
                <div class="hidden md:flex space-x-8 text-base font-bold">
                    <a href="#" class="hover:text-blue-400 transition-colors text-white">Projects</a>
                    <a href="#" class="hover:text-blue-400 transition-colors text-white">Services</a>
                    <a href="#" class="hover:text-blue-400 transition-colors text-white">About</a>
                    <a href="#" class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-lg transition-all">Contact Me</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="relative min-h-screen flex items-center justify-center overflow-hidden pt-16">
        
        <div class="absolute top-0 -left-4 w-72 h-72 bg-yellow-600 rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-blob"></div>
        <div class="absolute top-0 -right-4 w-72 h-72 bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-30 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob animation-delay-4000"></div>

        <div class="container mx-auto px-6 relative z-10 text-center">
            <div class="flex justify-center mb-8">
                <span class="inline-flex items-center py-1.5 px-3 rounded-full bg-white/5 border border-white/10 backdrop-blur-xl">
                    <span class="flex h-2 w-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                    <span class="text-xl font-bold text-yellow-500 italic">Available for New Projects</span>
                </span>
            </div>

            <h1 class="text-5xl md:text-8xl font-black text-white mb-8 tracking-tighter outline-none">
                Sober Mind. <br>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500">
                    Superior Code.
                </span>
            </h1>

            <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto mb-12 leading-relaxed">
                Clean architecture meets high-performance design. 
                Focusing on building the future of the web, one pixel at a time.
            </p>

            <div class="flex flex-col sm:flex-row gap-5 justify-center">
                <button class="group relative px-8 py-4 bg-blue-600 text-white font-bold rounded-2xl transition-all duration-300 hover:bg-blue-700 hover:scale-105 active:scale-95 shadow-2xl shadow-blue-500/20">
                    Get Started
                    <span class="absolute -top-1 -right-1 flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
                    </span>
                </button>
                
                <button class="px-8 py-4 bg-white/5 hover:bg-white/10 text-white font-bold rounded-2xl border border-white/10 transition-all duration-300 backdrop-blur-xl hover:border-white/20">
                    View My Work
                </button>
            </div>

            <div class="mt-20 pt-10 border-t border-white/5 flex flex-wrap justify-center gap-12">
                <div class="text-center">
                    <p class="text-2xl font-bold text-white">11+</p>
                    <p class="text-xs uppercase tracking-widest text-slate-500">Days Clean</p>
                </div>
                <div class="text-center">
                    <p class="text-2xl font-bold text-white">Fast</p>
                    <p class="text-xs uppercase tracking-widest text-slate-500">Delivery</p>
                </div>
                <div class="text-center">
                    <p class="text-2xl font-bold text-white">Modern</p>
                    <p class="text-xs uppercase tracking-widest text-slate-500">Tech Stack</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
